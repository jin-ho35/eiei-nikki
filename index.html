<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永々日記</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="top.css">
<link rel="manifest" href="manifest.json">

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</head>
<body>

<div class="container">
 <div id="year-nav">
  <span id="prev-year" class="year-arrow">＜</span>
  <h1 id="year-title"></h1>
  <span id="next-year" class="year-arrow">＞</span>
</div>
<h1 id="month-title"></h1>
<div id="day-list"></div>

<div id="month-select"></div>
 
<div id="backup-buttons">
  <button id="export-btn">バックアップ作成</button>
  <button id="import-btn">バックアップ復元</button>
  <input type="file" id="import-file" style="display:none;">
</div>

<!-- ★ 初期化ボタン（中央揃え＋間隔あり） -->
<div id="reset-area">
  <button id="reset-btn">初期化する</button>
</div>

<script src="top.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
